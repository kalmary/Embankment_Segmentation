[project]
name = "embankment-segmentation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
basic = [
    "numpy>=1.26,<3",
    "psycopg2-binary>=2.9,<3",
    "scipy>=1.16,<2",
    "shapely>=2.1,<3",
    "tqdm>=4.67,<5",
]
dev = [
    { include-group = "basic" },
    "laspy>=2.6,<3",
    "laszip>=0.2,<1",
    "lazrs>=0.8,<1",
    "matplotlib>=3.10,<4",
    "open3d>=0.19,<0.20",
    "pytest>=9,<10",
    "pyvista>=0.47,<1",
]

[tool.uv]
package = false
default-groups = ["basic"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "Segment*.py", "ground_config.py", "segment_ground.py"]
